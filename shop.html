<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop | Watillery</title>
    <meta name="description" content="Browse Watillery water guns, gel-pellet shooters and aquatic toys.">
    <link rel="icon" type="image/png" href="img/icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,400,0,0&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sections.css">
    <link rel="stylesheet" href="auth-styles.css">
</head>
<body data-page="shop">
    <div data-partial="nav"></div>

    <section class="page-hero short">
        <div class="container">
            <h1>Shop</h1>
            <p>Every blaster here has been through a real summer first.</p>
        </div>
        <div class="hero-wave" aria-hidden="true">
            <svg viewBox="0 0 1440 100" preserveAspectRatio="none"><path d="M0,52 C240,96 480,96 720,56 C960,16 1200,8 1440,48 L1440,100 L0,100 Z"></path></svg>
        </div>
    </section>

    <section id="shop" class="products-section">
        <div class="container">
            <div class="filters">
                <button class="filter-btn active" data-filter="all">All Products</button>
                <button class="filter-btn" data-filter="water-guns">Water Guns</button>
                <button class="filter-btn" data-filter="gel-pellet-shooters">Gel-Pellet Shooters</button>
                <button class="filter-btn" data-filter="toys">Aquatic Toys</button>
                <button class="filter-btn" data-filter="misc">Miscellaneous</button>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Search products...">
                <span class="material-symbols-rounded search-icon" aria-hidden="true">search</span>
            </div>

            <div class="products-grid" id="productsGrid"></div>
            <div id="pagination"></div>
        </div>
    </section>

    <div data-partial="footer"></div>
    <div data-partial="modals"></div>

    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <script>window.emailjs && emailjs.init({ publicKey: 'oIzl4RHrfOtpbyh72' });</script>
    <script src="database.js"></script>
    <script src="email-service.js"></script>
    <script src="partials.js"></script>
    <script src="team.js"></script>
    <script src="events.js"></script>
    <script src="promos.js"></script>
    <script src="admin-panel.js"></script>
    <script src="products.js"></script>
    <script src="cart.js"></script>
    <script src="slideshow.js"></script>
    <script src="shop.js"></script>
    <script src="main.js"></script>
</body>
</html>
